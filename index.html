<!DOCTYPE html>
<html>

<head>

<title>Home Page</title>

<style>

body{
    margin:0;
    padding:0;
    background-color:#fffdf8;
    font-family:Arial;
    overflow:hidden;
}

/* TOP BAR */

.top{
    width:100%;
    height:20px;
    background-color:#cfd97c;
}


/* MAIN SECTION */

.main{
    width:100%;
    margin-top:70px;
    text-align:center;
    position:relative;
}

/* PHOTO */

.photo{
    width:220px;
    height:220px;
    border-radius:50%;
    border:4px solid #f5a3b3;
    object-fit:cover;
    position:absolute;
    left:220px;
    top:20px;
}

/* BLUE SHAPE */

.shape{
    width:650px;
    height:230px;
    background-color:#b7cde8;
    border-radius:120px;
    margin:auto;
}

/* TITLE */

.title{
    position:absolute;
    top:80px;
    left:50%;
    transform:translateX(-50%);
    font-size:70px;
    color:#6e6b2d;
    font-family:Georgia;
    font-weight:bold;
    text-align:center;
    width:100%;
}

/* DECORATIONS */

.wave{
    position:absolute;
    top:-40px;
    left:650px;
    font-size:80px;
    color:#f5a3b3;
}

.star{
    position:absolute;
    top:300px;
    left:730px;
    font-size:60px;
    color:#d8d86f;
}

.flower{
    position:absolute;
    top:250px;
    right:180px;
    font-size:90px;
    color:#66b8b0;
}

.rainbow{
    position:absolute;
    top:250px;
    left:180px;
    font-size:90px;
    color:#f5a3b3;
}

/* BUTTON */

.button{
    text-align:center;
    margin-top:100px;
}

.button a{
    text-decoration:none;
    background-color:#f0a18f;
    color:white;
    padding:15px 30px;
    border-radius:30px;
    font-size:18px;
}

.button a:hover{
    background-color:#e48872;
}

/* BOTTOM WAVE */

.bottom{
    width:100%;
    height:40px;
    background-color:#f0a18f;
    position:absolute;
    bottom:0;
}

</style>

</head>

<body>

<div class="top"></div>


<!-- MAIN -->

<div class="main">

<div class="wave">〰</div>

<div class="rainbow">◠</div>

<div class="shape"></div>

<img src="images/profile.jpg"
class="photo">

<div class="title" align="center">Welcome home</div>

<div class="flower">✿</div>

</div>

<!-- BUTTON -->

<div class="button">

<a href="aboutme.html">
ENTER WEBSITE
</a>

</div>

<div class="bottom"></div>

</body>

</html>
